<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADE — Sistema Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EEF3FA;
  --surface:#FFFFFF;
  --surface2:#F4F7FB;
  --border:rgba(11,61,124,.1);
  --border2:rgba(11,61,124,.18);
  --text:#10243f;
  --muted:#5C6B7E;
  --muted2:#8fa0b5;
  --accent:#0B3D7C;
  --green:#1a7a4a;
  --red:#c0392b;
  --blue:#0B3D7C;
  --blue-light:#3B92C4;
  --blue-dark:#072957;
  --blue-deep:#0F2847;
  --gold:#C9A24B;
  --amber:#d97706;
  --purple:#7c3aed;
  --sidebar-w:72px;
  --header-h:58px;
  --chat-w:300px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Archivo',sans-serif;
  height:100vh;
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr var(--chat-w);
  grid-template-rows:var(--header-h) 1fr;
  overflow:hidden;
}
@media(max-width:900px){
  body{grid-template-columns:0 1fr 0;--sidebar-w:0;--chat-w:0}
  .sidebar,.chat-panel{display:none}
}

/* HEADER */
header{
  grid-column:1/-1;
  background:var(--blue-deep);
  background-image:radial-gradient(circle at 15% 50%, rgba(59,146,196,.18), transparent 50%),
                   radial-gradient(circle at 85% 50%, rgba(11,61,124,.4), transparent 55%);
  border-bottom:none;
  display:flex;align-items:center;
  padding:0 20px;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;width:var(--sidebar-w);padding-right:16px;border-right:1px solid rgba(255,255,255,.12)}
.brand-logo{font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.02em;font-family:'Archivo',sans-serif}
.brand-logo span{color:var(--gold)}
.brand-sub{font-size:10px;color:rgba(255,255,255,.5);font-family:'Space Mono',monospace;margin-top:1px}
.header-pills{display:flex;align-items:center;gap:8px;margin-left:4px}
.hpill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,.7);font-family:'Space Mono',monospace}
.hpill .dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.hpill strong{color:#fff;font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,.8);cursor:pointer;font-family:'Archivo',sans-serif;font-weight:500;transition:all .15s}
.hbtn:hover{background:rgba(255,255,255,.18);color:#fff}

/* SIDEBAR */
.sidebar{
  background:var(--blue-deep);
  background-image:radial-gradient(circle at 50% 80%, rgba(59,146,196,.1), transparent 60%);
  border-right:none;
  overflow-y:auto;
  padding:16px 12px;
  display:flex;flex-direction:column;gap:4px;
}
.sidebar-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:0.1em;padding:4px 8px;margin-top:10px}
.sidebar-label:first-child{margin-top:0}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(59,146,196,.2);color:#fff;font-weight:600;border-left:2px solid var(--gold)}
.nav-item .icon{font-size:15px;width:20px;text-align:center}
.sb-divider{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.sb-kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;margin:2px 0}
.sb-kpi-lbl{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px}
.sb-kpi-val{font-size:15px;font-weight:700;color:#fff;font-family:'Space Mono',monospace}
.sb-kpi-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:3px;font-family:'Space Mono',monospace}
.sb-kpi.green .sb-kpi-val{color:#4ade80}
.sb-kpi.red .sb-kpi-val{color:#f87171}
.sb-kpi.amber .sb-kpi-val{color:var(--gold)}

/* MAIN */
.main{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.tab-bar{display:flex;gap:2px;padding:10px 16px 0;background:var(--surface);border-bottom:2px solid var(--border);overflow-x:auto;box-shadow:0 1px 3px rgba(11,61,124,.06)}
.tab-bar::-webkit-scrollbar{height:0}
.tab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap;transition:all .15s;border-bottom:2px solid transparent;font-family:'Archivo',sans-serif}
.tab:hover{color:var(--blue)}
.tab.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600;background:rgba(11,61,124,.04)}
.content-area{flex:1;overflow-y:auto;padding:0}

/* CHAT PANEL */
.chat-panel{
  background:var(--surface);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:-2px 0 8px rgba(11,61,124,.05);
}
.chat-header{padding:14px 16px;background:var(--blue);border-bottom:none}
.chat-header-title{font-size:13px;font-weight:700;color:#fff;font-family:'Archivo',sans-serif}
.chat-header-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;font-family:'Space Mono',monospace}
.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#F8FAFD}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.6;max-width:92%}
.msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-radius:12px 12px 4px 12px;font-weight:500}
.msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;color:var(--text);box-shadow:0 1px 3px rgba(11,61,124,.06);border-radius:4px 12px 12px 12px}
.quick-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--border)}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:5px 11px;font-size:11px;color:var(--blue);cursor:pointer;font-weight:600;transition:all .15s}
.chip:hover{background:rgba(11,61,124,.1);border-color:rgba(11,61,124,.2)}
.input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.input-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none;transition:border .15s}
.input-row input:focus{border-color:var(--blue)}
.send{background:var(--blue);border:none;border-radius:8px;width:34px;height:34px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.send:hover{opacity:.85}

/* PANELS */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:90}
.side-panel{position:fixed;right:-420px;top:0;bottom:0;width:380px;background:var(--surface);border-left:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:right .25s}
.side-panel.open{right:0}
.side-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.side-panel-header button{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer}
.side-panel-body{flex:1;overflow-y:auto;padding:16px}
.side-panel-footer{padding:12px 16px;border-top:1px solid var(--border)}
.fav-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.fav-item:hover{background:var(--border)}
.fav-del{color:var(--muted);font-size:16px;padding:0 4px}
.fav-add-row{display:flex;gap:8px}
.fav-add-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;font-family:'Space Grotesk',sans-serif;color:var(--text)}
.fav-add-row button{background:var(--green);border:none;border-radius:8px;padding:7px 14px;color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.train-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5}
.train-item:last-child{border-bottom:none}
.train-del{color:var(--muted);cursor:pointer;font-size:11px;float:right}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}

/* MOVIMIENTOS TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:0.07em;padding:0 12px 10px;text-align:left;font-weight:700;border-bottom:2px solid rgba(11,61,124,.12);font-family:'Archivo',sans-serif}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--surface2)}
.tag{font-size:9px;background:rgba(11,61,124,.07);color:var(--blue-dark);padding:2px 7px;border-radius:4px;font-family:'Space Mono',monospace;white-space:nowrap;border:1px solid rgba(11,61,124,.14)}
.tag.green{background:#f0fdf8;color:#1a7a4a;border-color:rgba(26,122,74,.25)}
.tag.red{background:#fef3f2;color:#c0392b;border-color:rgba(192,57,43,.2)}
.pos{color:var(--green);font-weight:600;font-family:'Space Mono',monospace}
.neg{color:var(--red);font-weight:600;font-family:'Space Mono',monospace}
.tx-filter-row{display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.tx-filter-row input,.tx-filter-row select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;outline:none}
.tx-filter-row input:focus,.tx-filter-row select:focus{border-color:var(--green)}
.tx-count{font-size:11px;color:var(--muted);margin-left:auto;font-family:'Space Mono',monospace}
.tx-wrap{padding:0 0 16px}

/* CUENTAS */
.cuenta-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin:0 16px 10px}
.cuenta-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cuenta-nombre{font-size:14px;font-weight:600;color:var(--text)}
.cuenta-saldo{font-size:18px;font-weight:700;font-family:'Space Mono',monospace}
.cuenta-saldo.debe{color:var(--red)}
.cuenta-saldo.favor{color:var(--green)}
.cc-movs{font-size:11px;color:var(--muted);margin-top:4px}

/* CHEQUES */
.cheque-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px}
.cheque-tipo{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.cheque-tipo.emit{background:#fef2f2}
.cheque-tipo.recv{background:#f0fdf4}
.cheque-info{flex:1}
.cheque-prov{font-size:13px;font-weight:600;color:var(--text)}
.cheque-fecha{font-size:11px;color:var(--muted);margin-top:2px;font-family:'Space Mono',monospace}
.cheque-monto{font-size:15px;font-weight:700;font-family:'Space Mono',monospace}
.cheque-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
.cheque-badge.pend{background:#fef9c3;color:#854d0e}
.cheque-badge.cob{background:#f0fdf4;color:var(--green)}

/* INVERSORES */
.inv-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin:0 16px 10px}
.inv-header{display:flex;align-items:center;justify-content:space-between}
.inv-nombre{font-size:14px;font-weight:600}
.inv-deuda{font-size:18px;font-weight:700;color:var(--red);font-family:'Space Mono',monospace}
.inv-details{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.inv-detail{font-size:11px;color:var(--muted)}
.inv-detail strong{color:var(--text);display:block;font-family:'Space Mono',monospace}

/* SECCION HEADERS */
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:13px;font-weight:600;color:var(--text)}
.section-hdr .count{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;font-weight:400}

/* FLUJOS */
.dash-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(11,61,124,.05)}
.dash-card.full{grid-column:1/-1}
.dash-card h3{font-size:12px;font-weight:700;color:var(--blue-dark);margin-bottom:12px;font-family:'Archivo',sans-serif;text-transform:uppercase;letter-spacing:0.04em}
.kpi-card{background:var(--surface);border-radius:10px;padding:14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(11,61,124,.06)}
.kpi-card.green{background:#f0fdf8;border-color:rgba(26,122,74,.2)}
.kpi-card.gold{background:#fffdf5;border-color:rgba(201,162,75,.25)}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:700;margin-bottom:6px;font-family:'Archivo',sans-serif}
.kpi-value{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:var(--text)}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:10px;color:var(--muted);width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px}
.bar-fill{height:6px;background:var(--blue);border-radius:3px}
.bar-val{font-size:11px;font-family:'Space Mono',monospace;color:var(--text);font-weight:500;width:60px;text-align:right}
.section-divider{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;padding:10px 0 6px}

/* DASHBOARD v3 */
.d3w{font-family:'Space Grotesk',sans-serif;padding:16px;background:var(--bg);min-height:100%;overflow-y:auto}
.d3-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--surface);box-shadow:0 2px 8px rgba(11,61,124,.08)}
@media(max-width:700px){.d3-strip{grid-template-columns:1fr 1fr}.d3-row2{grid-template-columns:1fr!important}}
.d3-kpi{padding:16px 18px;border-right:1px solid var(--border);position:relative}
.d3-kpi:last-child{border-right:none}
.d3-kpi-accent{position:absolute;top:0;left:0;right:0;height:3px}
.d3-kpi-lbl{font-size:10px;color:var(--muted2);margin-bottom:8px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
.d3-kpi-n{font-size:18px;font-weight:700;color:var(--text);font-family:'Space Mono',monospace;letter-spacing:-0.02em}
.d3-kpi-sub{font-size:10px;color:var(--muted2);margin-top:5px;font-family:'Space Mono',monospace}
.d3-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.d3-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.d3-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.d3-panel-ttl{font-size:11px;font-weight:700;color:var(--blue-dark);text-transform:uppercase;letter-spacing:0.04em;font-family:'Archivo',sans-serif}
.d3-pill{font-size:10px;background:var(--surface2);color:var(--muted);padding:3px 8px;border-radius:20px;font-family:'Space Mono',monospace;border:1px solid var(--border)}
.d3-flow-rows{display:flex;flex-direction:column;gap:7px}
.d3-flow-row{display:flex;align-items:center;gap:8px}
.d3-flow-month{font-size:10px;font-family:'Space Mono',monospace;color:var(--muted2);width:22px;flex-shrink:0}
.d3-flow-bars{flex:1;display:flex;flex-direction:column;gap:2px}
.d3-flow-bar{height:5px;border-radius:2px;min-width:2px}
.d3-flow-val{font-size:10px;font-family:'Space Mono',monospace;color:var(--muted);width:42px;text-align:right;flex-shrink:0}
.d3-donut-wrap{display:flex;align-items:center;gap:14px}
.d3-donut{position:relative;width:80px;height:80px;flex-shrink:0}
.d3-donut svg{width:80px;height:80px}
.d3-donut-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d3-donut-pct{font-size:12px;font-weight:700;font-family:'Space Mono',monospace;color:var(--text)}
.d3-donut-lbl{font-size:9px;color:var(--muted2)}
.d3-donut-list{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.d3-dl-row{display:flex;align-items:center;gap:6px}
.d3-dl-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.d3-dl-name{font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d3-dl-pct{font-size:11px;font-weight:600;color:var(--text);font-family:'Space Mono',monospace;flex-shrink:0}
.d3-wide{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.d3-tx-table{width:100%;border-collapse:collapse}
.d3-tx-table th{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;padding:0 8px 10px 0;text-align:left;font-weight:600;border-bottom:1px solid var(--border)}
.d3-tx-table td{font-size:12px;padding:8px 8px 8px 0;border-bottom:1px solid var(--bg);color:var(--text);vertical-align:middle}
.d3-tx-table tr:last-child td{border-bottom:none}
.d3-tag{font-size:9px;background:var(--surface2);color:var(--muted);padding:2px 6px;border-radius:4px;font-family:'Space Mono',monospace;white-space:nowrap;border:1px solid var(--border)}
.d3-lg{display:flex;gap:12px;margin-bottom:10px}
.d3-lg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.d3-lg-sq{width:10px;height:5px;border-radius:2px}
.empty-dash{text-align:center;color:var(--muted);font-size:13px;padding:60px 0}
</style>
</head>
<body>
<header>
  <div class="brand">🐄</div>
  <div class="header-title" id="page-title">Dashboard</div>
  <div class="header-pills">
    <div class="hpill"><div class="dot"></div><span>Railway</span><strong>Online</strong></div>
    <div class="hpill" id="tc-pill"><span>TC</span><strong id="tc-val">—</strong></div>
    <div class="hpill" id="movs-pill"><strong id="movs-val">— mov</strong></div>
  </div>
  <div class="header-actions">
    <button class="hbtn" onclick="openPanel('trainPanel')">🧠 <span id="train-count">0</span></button>
    <button class="hbtn" onclick="openPanel('favPanel')">📌</button>
    <button class="hbtn primary" onclick="exportarCSV()">⬇ CSV</button>
  </div>
</header>

<div class="panel-overlay" id="panelOverlay" onclick="closeAllPanels()"></div>

<div class="side-panel" id="trainPanel">
  <div class="side-panel-header">
    <span>🧠 Entrenamiento</span>
    <button onclick="closeAllPanels()">✕</button>
  </div>
  <div class="side-panel-body" id="trainList"></div>
  <div class="side-panel-footer">
    <button class="hbtn" onclick="clearTraining()" style="width:100%">Borrar todo</button>
  </div>
</div>

<div class="side-panel" id="favPanel">
  <div class="side-panel-header">
    <span>📌 Favoritos</span>
    <button onclick="closeAllPanels()">✕</button>
  </div>
  <div class="side-panel-body" id="favList"></div>
  <div class="side-panel-footer" style="flex-direction:column;gap:8px">
    <div class="fav-add-row">
      <input type="text" id="favInput" placeholder="Agregar favorito..."/>
      <button onclick="addFav()">+</button>
    </div>
  </div>
</div>

<aside class="sidebar">
  <div class="nav-item active" onclick="setTab('dashboard')" title="Dashboard"><span class="icon">📊</span></div>
  <div class="nav-item" onclick="setTab('movimientos')" title="Movimientos"><span class="icon">💵</span></div>
  <div class="nav-item" onclick="setTab('cuentas')" title="Cuentas CC"><span class="icon">🔄</span></div>
  <div class="nav-item" onclick="setTab('cheques')" title="Cheques"><span class="icon">🏦</span></div>
  <div class="nav-item" onclick="setTab('inversores')" title="Inversores"><span class="icon">👥</span></div>
  <div class="nav-item" onclick="setTab('flujos')" title="Flujos Anuales"><span class="icon">📈</span></div>
  <div class="nav-item" onclick="setTab('socios')" title="Socios"><span class="icon">🤝</span></div>
  <div class="sb-divider"></div>
  <div class="nav-item" onclick="setTab('banco')" title="Banco"><span class="icon">🏛</span></div>
  <!-- IDs ocultos para updateSidebar -->
  <span id="sb-egresos" style="display:none"></span>
  <span id="sb-ingresos" style="display:none"></span>
  <span id="sb-cheques" style="display:none"></span>
  <span id="sb-cheques-monto" style="display:none"></span>
  <span id="sb-inv-count" style="display:none"></span>
  <span id="sb-deuda" style="display:none"></span>
</aside>

<main class="main">
  <div class="tab-bar" id="tabBar">
    <div class="tab active" onclick="setTab('dashboard')">Dashboard</div>
    <div class="tab" onclick="setTab('movimientos')">Movimientos</div>
    <div class="tab" onclick="setTab('cuentas')">Cuentas</div>
    <div class="tab" onclick="setTab('cheques')">Cheques</div>
    <div class="tab" onclick="setTab('inversores')">Inversores</div>
    <div class="tab" onclick="setTab('flujos')">Flujos</div>
    <div class="tab" onclick="setTab('banco')">Banco</div>
    <div class="tab" onclick="setTab('socios')">Socios</div>
  </div>

    <div class="empty-dash">Cargando datos...</div>
  </div>
</main>

<div class="chat-panel">
  <div class="chat-header">
    <div class="chat-header-title">🐄 Asistente IMP</div>
    <div class="chat-header-sub" id="chat-status">Conectando...</div>
  </div>
  <div class="chat-area" id="chat"></div>

    <div class="chip" onclick="ask('resumen del mes actual')">Resumen</div>
    <div class="chip" onclick="ask('ver cuentas corrientes')">Cuentas</div>

    <div class="chip" onclick="ask('últimos movimientos')">Últimos</div>
  </div>

    <input type="text" id="inp" placeholder="Consultá o registrá con IMP..."/>
    <button class="send" id="sendBtn" onclick="sendMsg()">↑</button>

</div>

<script>

// ==================== CONFIG ====================
const RAILWAY_URL = 'https://improlux-bot-production.up.railway.app';
const TRAIN_KEY = 'improlux_v4_training';
const FAV_KEY   = 'improlux_v4_favs';

// ==================== TC ====================
let tcHoy = null;
async function fetchTC() {
  try {
    const res = await fetch(`${RAILWAY_URL}/api/tc`);
    const d = await res.json();
    if (d?.tc) {
      tcHoy = parseFloat(d.tc);
      document.getElementById('tc-val').textContent = '$' + tcHoy.toFixed(2);
    }
  } catch(e) {
    document.getElementById('tc-val').textContent = 'N/D';
  }
}

// ==================== DATA ====================
let data = { transacciones:[], cuentas:[], cheques:[], inversores:[], resumen:{} };
const fmt = n => '$' + parseFloat(n||0).toLocaleString('es-UY',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2 = n => '$' + parseFloat(n||0).toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});

async function loadAll() {
  try {
    const [tx, cuentas, cheques, inversores, resumen, dividendos] = await Promise.all([
      fetch(`${RAILWAY_URL}/api/transacciones?limite=2000&t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAILWAY_URL}/api/cuentas?t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAILWAY_URL}/api/cheques?t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAILWAY_URL}/api/inversores?t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAILWAY_URL}/api/resumen?t=${Date.now()}`).then(r=>r.json()),
      fetch(`${RAILWAY_URL}/api/dividendos?t=${Date.now()}`).then(r=>r.json()).catch(()=>({pablo:0,joni:0,total:0,historial:[]})),
    ]);
    data.transacciones = Array.isArray(tx) ? tx : [];
    data.cuentas = Array.isArray(cuentas) ? cuentas : [];
    data.cheques = Array.isArray(cheques) ? cheques : [];
    data.inversores = Array.isArray(inversores) ? inversores : [];
    data.resumen = resumen || {};
    data.dividendos = dividendos || {pablo:0,joni:0,total:0,historial:[],por_mes:{}};
    updateSidebar();
    renderTab(currentTab);
    document.getElementById('movs-val').textContent = data.transacciones.length + ' mov';
    document.getElementById('chat-status').textContent = 'Listo · ' + new Date().toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('chat-status').textContent = 'Error de conexión';
  }
}

function updateSidebar() {
  const r = data.resumen;
  document.getElementById('sb-egresos').textContent = fmt(r.egresos_mes||0);
  document.getElementById('sb-ingresos').textContent = fmt(r.ingresos_mes||0);
  document.getElementById('sb-cheques').textContent = r.cheques_pendientes||0;
  document.getElementById('sb-cheques-monto').textContent = fmt(r.monto_cheques||0) + ' USD';
  const totalDeuda = data.inversores.reduce((s,i)=>s+parseFloat(i.deuda_calculada||i.deuda_actual||0),0);
  document.getElementById('sb-deuda').textContent = fmt(totalDeuda);
  document.getElementById('sb-inv-count').textContent = data.inversores.filter(i=>i.estado==='ACTIVO').length + ' activos';
}

// ==================== TABS ====================
let currentTab = 'dashboard';
let chartInstance = null;

const TAB_TITLES = {dashboard:'Dashboard',movimientos:'Movimientos',cuentas:'Cuentas Corrientes',cheques:'Cheques',inversores:'Inversores',flujos:'Flujos Anuales',banco:'Banco',socios:'Socios'};
function setTab(tab) {
  currentTab = tab;
  const tabs = ['dashboard','movimientos','cuentas','cheques','inversores','flujos','banco','socios'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i] === tab));
  document.querySelectorAll('.nav-item').forEach((n,i) => n.classList.toggle('active', tabs[i] === tab));
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = TAB_TITLES[tab] || tab;
  renderTab(tab);
}

function renderTab(tab) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const area = document.getElementById('contentArea');
  if (tab === 'dashboard') renderDashboard(area);
  else if (tab === 'movimientos') renderMovimientos(area);
  else if (tab === 'cuentas') renderCuentas(area);
  else if (tab === 'cheques') renderCheques(area);
  else if (tab === 'inversores') renderInversores(area);
  else if (tab === 'flujos') renderFlujos(area);
  else if (tab === 'banco') renderBanco(area);
  else if (tab === 'socios') renderSocios(area);
}

function renderDashboard(area) {
  if (chartInstance) { try { chartInstance.destroy(); } catch(e){} chartInstance = null; }
  const mesActual = new Date().toISOString().slice(0,7);

  // KPIs
  const txMes = data.transacciones.filter(t => (t.fecha||'').startsWith(mesActual));
  const egMes = txMes.reduce((s,t) => s+parseFloat(t.egreso||0),0);
  const ingMes = txMes.reduce((s,t) => s+parseFloat(t.ingreso||0),0);
  const netoMes = ingMes - egMes;

  const prevMes = new Date(); prevMes.setDate(1); prevMes.setMonth(prevMes.getMonth()-1);
  const prevKey = prevMes.toISOString().slice(0,7);
  const txPrev = data.transacciones.filter(t=>(t.fecha||'').startsWith(prevKey));
  const egPrev = txPrev.reduce((s,t)=>s+parseFloat(t.egreso||0),0);
  const diffEg = egMes - egPrev;
  const pctEg = egPrev > 0 ? Math.round((diffEg/egPrev)*100) : 0;

  const now = new Date();
  const anoGan = now.getMonth() >= 2 ? now.getFullYear() : now.getFullYear()-1;
  const anoLabel = anoGan + '/' + String(anoGan+1).slice(2);
  const txAno = data.transacciones.filter(t => {
    if (!t.fecha) return false;
    const d = new Date(t.fecha + 'T00:00:00');
    return d >= new Date(anoGan,2,1) && d < new Date(anoGan+1,2,1);
  });
  const egAno = txAno.reduce((s,t)=>s+parseFloat(t.egreso||0),0);

  // Flujo 6 meses
  const meses6 = [];
  for (let i=5;i>=0;i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key = d.toISOString().slice(0,7);
    const lbl = d.toLocaleDateString('es-UY',{month:'short'}).replace('.','').slice(0,3);
    const txM = data.transacciones.filter(t=>t.fecha?.startsWith(key));
    meses6.push({ lbl, eg: txM.reduce((s,t)=>s+parseFloat(t.egreso||0),0), ing: txM.reduce((s,t)=>s+parseFloat(t.ingreso||0),0) });
  }
  const maxFlow = Math.max(...meses6.map(m=>Math.max(m.eg,m.ing)),1);

  // Categorías mes (donut)
  const porCat = {};
  txMes.forEach(t => { if (t.egreso>0) porCat[t.concepto] = (porCat[t.concepto]||0)+parseFloat(t.egreso||0); });
  const cats = Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totalCat = cats.reduce((s,[,v])=>s+v,0)||1;
  const catColors = ['#16a34a','#2563eb','#d97706','#dc2626','#8b5cf6'];

  // Donut segments
  const perim = 2*Math.PI*28; // r=28
  let offset = 0;
  const segments = cats.map(([cat,val],i) => {
    const pct = val/totalCat;
    const dash = perim*pct;
    const gap = perim*(1-pct);
    const seg = { color:catColors[i], dash, gap, offset: -offset, pct:Math.round(pct*100), cat, val };
    offset += dash;
    return seg;
  });

  // Últimas transacciones
  const ultimas = data.transacciones.slice(0,6);

  const nomMes = new Date().toLocaleDateString('es-UY',{month:'long',year:'numeric'});

  area.innerHTML = `<div class="d3w">
    <div class="d3-strip">
      <div class="d3-kpi">
        <div class="d3-kpi-accent" style="background:${netoMes>=0?'#1a7a4a':'#c0392b'}"></div>
        <div class="d3-kpi-lbl">Neto del mes</div>
        <div class="d3-kpi-n" style="color:${netoMes>=0?'#16a34a':'#dc2626'}">${netoMes>=0?'+':''}${fmt(netoMes)}</div>
        <div class="d3-kpi-sub">${nomMes}</div>
      </div>
      <div class="d3-kpi">
        <div class="d3-kpi-accent" style="background:#c0392b"></div>
        <div class="d3-kpi-lbl">Egresos</div>
        <div class="d3-kpi-n" style="color:#dc2626">${fmt(egMes)}</div>
        <div class="d3-kpi-sub">${diffEg>0?'↑ +':'↓ '}${Math.abs(pctEg)}% vs anterior</div>
      </div>
      <div class="d3-kpi">
        <div class="d3-kpi-accent" style="background:#0B3D7C"></div>
        <div class="d3-kpi-lbl">Ingresos</div>
        <div class="d3-kpi-n" style="color:#2563eb">${fmt(ingMes)}</div>
        <div class="d3-kpi-sub">${txMes.filter(t=>t.ingreso>0).length} operaciones</div>
      </div>
      <div class="d3-kpi">
        <div class="d3-kpi-accent" style="background:#C9A24B"></div>
        <div class="d3-kpi-lbl">Ciclo ${anoLabel}</div>
        <div class="d3-kpi-n">${fmt(egAno)}</div>
        <div class="d3-kpi-sub">egresos acumulados</div>
      </div>
    </div>

    <div class="d3-row2">
      <div class="d3-panel">
        <div class="d3-panel-hdr"><span class="d3-panel-ttl">Flujo mensual</span><span class="d3-pill">6 meses · USD</span></div>
        <div class="d3-lg">
          <div class="d3-lg-item"><div class="d3-lg-sq" style="background:#fca5a5"></div>Egresos</div>
          <div class="d3-lg-item"><div class="d3-lg-sq" style="background:#86efac"></div>Ingresos</div>
        </div>
        <div class="d3-flow-rows">
          ${meses6.map(m=>`<div class="d3-flow-row">
            <span class="d3-flow-month">${m.lbl}</span>
            <div class="d3-flow-bars">
              <div class="d3-flow-bar" style="width:${m.eg?Math.max((m.eg/maxFlow*100),1)+'%':'2px'};background:#fca5a5"></div>
              <div class="d3-flow-bar" style="width:${m.ing?Math.max((m.ing/maxFlow*100),1)+'%':'2px'};background:#86efac"></div>
            </div>
            <span class="d3-flow-val">${fmt(Math.max(m.eg,m.ing))}</span>
          </div>`).join('')}
        </div>
      </div>

      <div class="d3-panel">
        <div class="d3-panel-hdr"><span class="d3-panel-ttl">Egresos por rubro</span><span class="d3-pill">${nomMes.split(' ')[0]}</span></div>
        ${cats.length ? `<div class="d3-donut-wrap">
          <div class="d3-donut">
            <svg viewBox="0 0 80 80" role="img" aria-label="Donut chart de egresos por categoría">
              <circle cx="40" cy="40" r="28" fill="none" stroke="#f1f5f9" stroke-width="10"/>
              ${segments.map(s=>`<circle cx="40" cy="40" r="28" fill="none" stroke="${s.color}" stroke-width="10"
                stroke-dasharray="${s.dash.toFixed(1)} ${s.gap.toFixed(1)}"
                stroke-dashoffset="${s.offset.toFixed(1)}" stroke-linecap="butt"/>`).join('')}
            </svg>
            <div class="d3-donut-ctr"><div class="d3-donut-pct">${fmt(egMes)}</div><div class="d3-donut-lbl">total</div></div>
          </div>
          <div class="d3-donut-list">
            ${segments.map(s=>`<div class="d3-dl-row">
              <div class="d3-dl-dot" style="background:${s.color}"></div>
              <span class="d3-dl-name">${s.cat}</span>
              <span class="d3-dl-pct">${s.pct}%</span>
            </div>`).join('')}
          </div>
        </div>` : '<div style="font-size:12px;color:#94a3b8;text-align:center;padding:20px 0">Sin egresos este mes</div>'}
      </div>
    </div>

    <div class="d3-wide">
      <div class="d3-panel-hdr" style="margin-bottom:0"><span class="d3-panel-ttl">Últimos movimientos</span><span class="d3-pill">en tiempo real</span></div>
      <table class="d3-tx-table">
        <thead><tr><th>Fecha</th><th>Detalle</th><th>Categoría</th><th style="text-align:right">Monto USD</th></tr></thead>
        <tbody>
          ${ultimas.map(t=>`<tr>
            <td style="font-family:'Space Mono',monospace;color:#94a3b8;white-space:nowrap">${t.fecha}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.detalle||t.concepto}</td>
            <td><span class="d3-tag">${t.concepto}</span></td>
            <td style="text-align:right;font-family:'Space Mono',monospace;font-weight:600;color:${t.ingreso>0?'#16a34a':'#dc2626'};white-space:nowrap">
              ${t.ingreso>0?'+':'-'}${fmt(t.ingreso>0?t.ingreso:t.egreso)}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderMovimientos(area) {
  const txs = data.transacciones.slice(0, 50);
  area.innerHTML = `
    <div class="dash-card full">
      <h3>Últimos movimientos</h3>
      ${txs.length ? `<table class="data-table">
        <thead><tr><th>Fecha</th><th>Concepto</th><th>Detalle</th><th>Proveedor</th><th>Egreso</th><th>Ingreso</th></tr></thead>
        <tbody>
          ${txs.map(t => `<tr>
            <td>${t.fecha||'—'}</td>
            <td><span class="tag red">${t.concepto||'—'}</span></td>
            <td>${t.detalle||'—'}</td>
            <td>${t.proveedor||'—'}</td>
            <td class="neg">${parseFloat(t.egreso||0)>0?fmt2(t.egreso):''}</td>
            <td class="pos">${parseFloat(t.ingreso||0)>0?fmt2(t.ingreso):''}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty-dash">Sin movimientos registrados</div>'}
    </div>`;
}

function renderCuentas(area) {
  const todas = data.cuentas;
  const conSaldo = todas.filter(c => Math.abs(parseFloat(c.saldo||0)) > 0.01);
  const totalDeuda = conSaldo.reduce((s,c) => s + Math.max(parseFloat(c.saldo||0),0), 0);

  area.innerHTML = `
    <div style="padding:16px">
      <!-- RESUMEN TOP -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
        <div class="kpi-card" style="margin:0">
          <div class="kpi-label">Proveedores activos</div>
          <div class="kpi-value">${conSaldo.length}</div>
        </div>
        <div class="kpi-card" style="margin:0;background:#fef2f2;border-color:#fecaca">
          <div class="kpi-label">Total adeudado</div>
          <div class="kpi-value neg">${fmt2(totalDeuda)}</div>
        </div>
        <div class="kpi-card" style="margin:0">
          <div class="kpi-label">Todos los proveedores</div>
          <div class="kpi-value">${todas.length}</div>
        </div>
      </div>

      <!-- TABLA PROVEEDORES -->
      <div class="dash-card" style="padding:0;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;font-weight:600">Cuentas corrientes</div>
          <button onclick="exportarCuentasCSV()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:'Space Grotesk',sans-serif;color:var(--muted);font-weight:500">⬇ CSV resumen</button>
        </div>
        <table class="data-table" style="margin:0">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Notas</th>
              <th style="text-align:right">Saldo USD</th>
              <th style="text-align:center">Estado</th>
              <th style="text-align:center">Detalle</th>
            </tr>
          </thead>
          <tbody>
            ${todas.map(c => {
              const s = parseFloat(c.saldo||0);
              return `<tr>
                <td style="font-weight:600">${c.proveedor}</td>
                <td style="color:var(--muted);font-size:11px">${c.notas||'—'}</td>
                <td style="text-align:right" class="${s>0?'neg':s<0?'pos':''}">${fmt2(Math.abs(s))}</td>
                <td style="text-align:center"><span class="tag ${s>0?'red':s<0?'green':'gold'}">${s>0?'Debemos':s<0?'A favor':'Al día'}</span></td>
                <td style="text-align:center">
                  <button onclick="verDetalleCuenta('${c.proveedor}')" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:500;color:var(--text)">Ver →</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <!-- DETALLE CUENTA (oculto por defecto) -->
      <div id="cc-detalle-wrap" style="display:none;margin-top:16px">
        <div class="dash-card" style="padding:0;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">
            <div style="font-size:13px;font-weight:600" id="cc-detalle-titulo">Detalle</div>
            <div style="display:flex;gap:8px">
              <button onclick="exportarDetalleCuentaCSV()" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:5px 12px;font-size:11px;cursor:pointer;color:var(--green);font-weight:600">⬇ CSV detalle</button>
              <button onclick="document.getElementById('cc-detalle-wrap').style.display='none'" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;color:var(--muted)">✕</button>
            </div>
          </div>
          <div id="cc-detalle-kpis" style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--border)"></div>
          <table class="data-table" style="margin:0" id="cc-detalle-tabla">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Detalle</th>
                <th style="text-align:right">Monto USD</th>
                <th style="text-align:right">Saldo acum.</th>
              </tr>
            </thead>
            <tbody id="cc-detalle-body"></tbody>
          </table>
        </div>
      </div>
    </div>`;
}

let _ccDetalleActual = { proveedor: '', movimientos: [] };

async function verDetalleCuenta(proveedor) {
  const wrap = document.getElementById('cc-detalle-wrap');
  const titulo = document.getElementById('cc-detalle-titulo');
  const body = document.getElementById('cc-detalle-body');
  const kpis = document.getElementById('cc-detalle-kpis');

  titulo.textContent = `Cargando ${proveedor}...`;
  wrap.style.display = 'block';
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">Cargando...</td></tr>';

  try {

function descargarCSV(rows, filename) {
  const bom = '\uFEFF';
  const csv = bom + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = filename;
  a.click();
}

function getTraining() { try{return JSON.parse(localStorage.getItem(TRAIN_KEY)||'[]');}catch{return[];} }
function saveTraining(q,a) {
  const ex=getTraining();
  if(ex.some(e=>e.q===q)) return;
  ex.unshift({q,a,ts:Date.now()});
  if(ex.length>60) ex.length=60;
  localStorage.setItem(TRAIN_KEY,JSON.stringify(ex));
  updateTrainCount();
}
function deleteTraining(ts) { localStorage.setItem(TRAIN_KEY,JSON.stringify(getTraining().filter(e=>e.ts!==ts))); updateTrainCount(); renderTrainPanel(); }
function clearTraining() { if(!confirm('¿Borrar todos los ejemplos?'))return; localStorage.removeItem(TRAIN_KEY); updateTrainCount(); renderTrainPanel(); }

function exportTraining() {
  const d=getTraining(); if(!d.length){alert('Sin ejemplos.');return;}
  const a=document.createElement('a');

}
function importTraining(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{try{const imp=JSON.parse(ev.target.result);if(!Array.isArray(imp))throw 0;const merged=[...imp,...getTraining()].filter((x,i,a)=>a.findIndex(y=>y.q===x.q)===i).slice(0,60);localStorage.setItem(TRAIN_KEY,JSON.stringify(merged));updateTrainCount();renderTrainPanel();alert(`✅ ${imp.length} ejemplos importados.`);}catch{alert('❌ Archivo inválido.');}};
  r.readAsText(f); e.target.value='';
}

  const el=document.getElementById('trainList');

  if(!ex.length){el.innerHTML='<div class="empty-state">Sin ejemplos aún.<br>Confirmá respuestas con 👍.</div>';return;}

function detectarPesos(txt) {
  const patterns=[/(\d[\d.,]*)\s*(?:pesos?|peso|uy|uyu|\$uy)/i,/(?:pesos?|uyu)\s*[:\s]*(\d[\d.,]*)/i];
  for(const p of patterns){const m=txt.match(p);if(m){const n=parseFloat(m[1].replace(/\./g,'').replace(',','.'));if(!isNaN(n)&&n>0)return n;}}
  return null;
}

// ==================== FLUJOS ANUALES ====================
// Año ganadero: Marzo → Febrero
function getAnosGanaderos(desde = null) {
  const anos = [];
  const fechas = data.transacciones.map(t => t.fecha).filter(Boolean).sort();
  if (!fechas.length) return [];
  const primerAno = parseInt(fechas[0].slice(0,4));
  const mesInicio = parseInt(fechas[0].slice(5,7));
  const inicioReal = mesInicio < 3 ? primerAno - 1 : primerAno;
  const hoy = new Date();
  const anoActual = hoy.getMonth() >= 2 ? hoy.getFullYear() : hoy.getFullYear() - 1;
  const inicioAno = desde !== null ? desde : inicioReal;
  for (let a = inicioAno; a <= anoActual; a++) {
    anos.push({
      label: `${a}/${String(a+1).slice(2)}`,
      labelLong: `Mar ${a} — Feb ${a+1}`,
      desde: `${a}-03-01`,
      hasta: `${a+1}-02-28`,
      ano: a
    });
  }
  return anos.reverse();
}

// Obtener todos los años disponibles (sin filtro)
function getTodosLosAnos() {
  const fechas = data.transacciones.map(t => t.fecha).filter(Boolean).sort();
  if (!fechas.length) return [];
  const primerAno = parseInt(fechas[0].slice(0,4));
  const mesInicio = parseInt(fechas[0].slice(5,7));
  const inicioReal = mesInicio < 3 ? primerAno - 1 : primerAno;
  const hoy = new Date();
  const anoActual = hoy.getMonth() >= 2 ? hoy.getFullYear() : hoy.getFullYear() - 1;
  const result = [];
  for (let a = inicioReal; a <= anoActual; a++) {
    result.push({ label: `${a}/${String(a+1).slice(2)}`, ano: a });
  }
  return result.reverse();
}

function getTxPeriodo(desde, hasta) {
  return data.transacciones.filter(t => t.fecha >= desde && t.fecha <= hasta);
}

function renderFlujos(area) {
  const todosLosAnos = getTodosLosAnos();
  if (!todosLosAnos.length) { area.innerHTML = '<div class="empty-dash">Sin datos históricos aún.</div>'; return; }

  // Filtro de período: desde qué ciclo mostrar
  if (window._flujoDesdeAno === undefined) window._flujoDesdeAno = null; // null = todos

  const anos = getAnosGanaderos(window._flujoDesdeAno);
  if (!anos.length) { area.innerHTML = '<div class="empty-dash">Sin datos para el período seleccionado.</div>'; return; }

  const anoSelIdx = window._flujoAnoIdx !== undefined ? Math.min(window._flujoAnoIdx, anos.length-1) : 0;
  const ano = anos[anoSelIdx];
  const tx = getTxPeriodo(ano.desde, ano.hasta);
  const modoAcum = window._flujoModo === 'acumulado';

  // Agrupar por mes
  const meses = [];
  let acumEg = 0, acumIng = 0;
  for (let m = 0; m < 12; m++) {
    const fecha = new Date(ano.ano, 2 + m);
    const y = fecha.getFullYear();
    const mo = String(fecha.getMonth() + 1).padStart(2, '0');
    const key = `${y}-${mo}`;
    const txMes = tx.filter(t => t.fecha?.startsWith(key));
    const eg = txMes.reduce((s,t) => s + parseFloat(t.egreso||0), 0);
    const ing = txMes.reduce((s,t) => s + parseFloat(t.ingreso||0), 0);
    acumEg += eg; acumIng += ing;
    meses.push({ label: fecha.toLocaleDateString('es-UY', { month: 'short' }), key, eg, ing, acumEg, acumIng, neto: acumIng - acumEg });
  }

  const totalEg = meses[11].acumEg;
  const totalIng = meses[11].acumIng;
  const neto = totalIng - totalEg;

  // Totales acumulados de TODOS los ciclos del período filtrado
  const txPeriodoCompleto = getTxPeriodo(anos[anos.length-1].desde, anos[0].hasta);
  const totalEgPeriodo = txPeriodoCompleto.reduce((s,t) => s+parseFloat(t.egreso||0), 0);
  const totalIngPeriodo = txPeriodoCompleto.reduce((s,t) => s+parseFloat(t.ingreso||0), 0);
  const netoPeriodo = totalIngPeriodo - totalEgPeriodo;
  const hayFiltro = window._flujoDesdeAno !== null || anos.length > 1;

  // Categorías
  const porCat = {};
  tx.forEach(t => {
    if (!porCat[t.concepto]) porCat[t.concepto] = { egreso: 0, ingreso: 0 };
    porCat[t.concepto].egreso += parseFloat(t.egreso||0);
    porCat[t.concepto].ingreso += parseFloat(t.ingreso||0);
  });
  const cats = Object.entries(porCat).sort((a,b) => b[1].egreso - a[1].egreso);
  const maxCat = cats[0]?.[1].egreso || 1;

  // Comparación ciclos — todos los años
  const compData = anos.map(a => {
    const t = getTxPeriodo(a.desde, a.hasta);
    return { label: a.label, eg: t.reduce((s,tx)=>s+parseFloat(tx.egreso||0),0), ing: t.reduce((s,tx)=>s+parseFloat(tx.ingreso||0),0) };
  });

  // vs año anterior
  let compHtml = '';
  if (anoSelIdx < anos.length - 1) {
    const prev = compData[anoSelIdx + 1];
    const diff = totalEg - prev.eg;
    const pct = prev.eg > 0 ? ((diff/prev.eg)*100).toFixed(1) : 0;
    compHtml = `<div style="font-size:11px;font-family:'Space Mono',monospace;color:${diff>0?'var(--red)':'var(--green)'};margin-top:4px">
      vs ${prev.label}: ${diff>0?'▲':'▼'} ${fmt(Math.abs(diff))} (${Math.abs(pct)}%)
    </div>`;
  }

  area.innerHTML = `
    <div style="padding:16px;display:flex;flex-direction:column;gap:12px">

      <!-- SELECTOR DE AÑO + MODO + PERÍODO -->
      <div style="display:flex;flex-direction:column;gap:10px">

        <!-- FILA 1: Años + Modo -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${anos.map((a,i) => `<button onclick="window._flujoAnoIdx=${i};renderFlujos(document.getElementById('contentArea'))"
              style="background:${i===anoSelIdx?'var(--blue)':'var(--surface)'};border:1px solid ${i===anoSelIdx?'var(--blue)':'var(--border)'};color:${i===anoSelIdx?'white':'var(--muted)'};font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:600">
              ${a.label}
            </button>`).join('')}
          </div>
          <div style="display:flex;gap:6px">
            <button onclick="window._flujoModo='mensual';renderFlujos(document.getElementById('contentArea'))"
              style="background:${!modoAcum?'var(--green)':'var(--surface)'};border:1px solid ${!modoAcum?'var(--green)':'var(--border)'};color:${!modoAcum?'white':'var(--muted)'};font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600">
              Mensual
            </button>
            <button onclick="window._flujoModo='acumulado';renderFlujos(document.getElementById('contentArea'))"
              style="background:${modoAcum?'var(--green)':'var(--surface)'};border:1px solid ${modoAcum?'var(--green)':'var(--border)'};color:${modoAcum?'white':'var(--muted)'};font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600">
              Acumulado
            </button>
          </div>
        </div>

        <!-- FILA 2: Filtro de período acumulado -->
        <div style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;flex-wrap:wrap">
          <span style="font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap">📅 Período desde:</span>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <button onclick="window._flujoDesdeAno=null;window._flujoAnoIdx=0;renderFlujos(document.getElementById('contentArea'))"
              style="background:${window._flujoDesdeAno===null?'var(--blue)':'var(--surface2)'};border:1px solid ${window._flujoDesdeAno===null?'var(--blue)':'var(--border)'};color:${window._flujoDesdeAno===null?'white':'var(--muted)'};font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:600">
              Todos
            </button>
            ${todosLosAnos.map(a => `<button onclick="window._flujoDesdeAno=${a.ano};window._flujoAnoIdx=0;renderFlujos(document.getElementById('contentArea'))"
              style="background:${window._flujoDesdeAno===a.ano?'var(--blue)':'var(--surface2)'};border:1px solid ${window._flujoDesdeAno===a.ano?'var(--blue)':'var(--border)'};color:${window._flujoDesdeAno===a.ano?'white':'var(--muted)'};font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:600">
              desde ${a.label}
            </button>`).join('')}
          </div>
          <span style="font-size:10px;color:var(--muted2);margin-left:auto;font-family:'Space Mono',monospace">
            ${anos.length} ciclo${anos.length!==1?'s':''} · ${anos[anos.length-1]?.label||''} → ${anos[0]?.label||''}
          </span>
        </div>

      </div>

      <!-- KPIs -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        <div class="kpi-card" style="margin:0;background:#fef2f2;border-color:#fecaca">
          <div class="kpi-label">Egresos ${ano.label}</div>
          <div class="kpi-value neg">${fmt(totalEg)}</div>
          ${compHtml}
        </div>
        <div class="kpi-card green" style="margin:0">
          <div class="kpi-label">Ingresos ${ano.label}</div>
          <div class="kpi-value pos">${fmt(totalIng)}</div>
        </div>
        <div class="kpi-card" style="margin:0;background:${neto>=0?'#f0fdf4':'#fef2f2'};border-color:${neto>=0?'#bbf7d0':'#fecaca'}">
          <div class="kpi-label">Neto ${ano.label}</div>
          <div class="kpi-value" style="color:${neto>=0?'var(--green)':'var(--red)'}">${neto>=0?'+':''}${fmt(neto)}</div>
        </div>
        <div class="kpi-card" style="margin:0">
          <div class="kpi-label">Transacciones</div>
          <div class="kpi-value">${tx.length}</div>
        </div>
      </div>

      <!-- KPIs PERÍODO TOTAL (solo si hay múltiples ciclos) -->
      ${anos.length > 1 ? `
      <div style="background:linear-gradient(135deg,rgba(11,61,124,.06),rgba(11,61,124,.03));border:1px solid rgba(11,61,124,.12);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <div style="font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap">
          📊 Acumulado ${anos[anos.length-1].label} → ${anos[0].label}
        </div>
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <div>
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px">Total egresos</div>
            <div style="font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:var(--red)">${fmt(totalEgPeriodo)}</div>
          </div>
          <div>
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px">Total ingresos</div>
            <div style="font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:var(--green)">${fmt(totalIngPeriodo)}</div>
          </div>
          <div>
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px">Neto período</div>
            <div style="font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:${netoPeriodo>=0?'var(--green)':'var(--red)'}">
              ${netoPeriodo>=0?'+':''}${fmt(netoPeriodo)}
            </div>
          </div>
          <div>
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px">Ciclos</div>
            <div style="font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:var(--blue)">${anos.length}</div>
          </div>
        </div>
      </div>` : ''}

      <!-- GRÁFICO PRINCIPAL -->
      <div class="dash-card" style="padding:16px">
        <div style="font-size:12px;font-weight:600;margin-bottom:12px">${modoAcum ? 'Flujo acumulado' : 'Flujo mensual'} — ${ano.label}</div>
        <canvas id="chartFlujoAnual" style="max-height:220px"></canvas>
      </div>

      <!-- COMPARACIÓN CICLOS -->
      <div class="dash-card" style="padding:16px">
        <div style="font-size:12px;font-weight:600;margin-bottom:12px">Comparación de ciclos</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${compData.map(c => {
            const maxV = Math.max(...compData.map(x=>x.eg), 1);
            return `<div style="display:flex;align-items:center;gap:8px">
              <div style="font-size:11px;font-family:'Space Mono',monospace;color:var(--muted);width:52px">${c.label}</div>
              <div style="flex:1;display:flex;flex-direction:column;gap:2px">
                <div style="height:5px;background:#fca5a5;border-radius:2px;width:${(c.eg/maxV*100).toFixed(0)}%"></div>
                <div style="height:5px;background:#86efac;border-radius:2px;width:${(c.ing/maxV*100).toFixed(0)}%"></div>
              </div>
              <div style="font-size:11px;font-family:'Space Mono',monospace;color:var(--text);text-align:right;width:70px">${fmt(c.eg)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:10px">
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:5px;border-radius:2px;background:#fca5a5"></div>Egresos</div>
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:5px;border-radius:2px;background:#86efac"></div>Ingresos</div>
        </div>
      </div>

      <!-- DOS COLUMNAS: CATEGORIAS + TABLA -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="dash-card" style="padding:16px">
          <div style="font-size:12px;font-weight:600;margin-bottom:12px">Top egresos por categoría</div>
          <div class="bar-chart">
            ${cats.filter(([,v]) => v.egreso > 0).slice(0,10).map(([cat,v]) => `
              <div class="bar-row">
                <div class="bar-label">${cat}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(v.egreso/maxCat*100).toFixed(0)}%"></div></div>
                <div class="bar-val">${fmt(v.egreso)}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="dash-card" style="padding:16px">
          <div style="font-size:12px;font-weight:600;margin-bottom:12px">Detalle por categoría</div>
          <table class="data-table" style="margin:0">
            <thead><tr><th>Categoría</th><th style="text-align:right">Egresos</th><th style="text-align:right">%</th></tr></thead>
            <tbody>
              ${cats.filter(([,v])=>v.egreso>0).map(([cat,v]) => `<tr>
                <td style="font-size:11px">${cat}</td>
                <td class="neg" style="text-align:right">${fmt(v.egreso)}</td>
                <td style="text-align:right;color:var(--muted);font-size:11px">${(v.egreso/totalEg*100).toFixed(1)}%</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;

  // Chart
  setTimeout(() => {
    const ctx = document.getElementById('chartFlujoAnual')?.getContext('2d');
    if (!ctx) return;
    if (chartInstance) { try { chartInstance.destroy(); } catch(e){} }
    if (modoAcum) {
      // Línea acumulada: egresos, ingresos y neto
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: meses.map(m => m.label),
          datasets: [
            { label: 'Egresos acum.', data: meses.map(m=>m.acumEg), borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,0.08)', tension:0.3, fill:true, pointRadius:3 },
            { label: 'Ingresos acum.', data: meses.map(m=>m.acumIng), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,0.08)', tension:0.3, fill:true, pointRadius:3 },
            { label: 'Neto acum.', data: meses.map(m=>m.neto), borderColor:'#3b82f6', borderDash:[5,3], tension:0.3, fill:false, pointRadius:3 },
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins: { legend:{labels:{color:'#64748b',font:{size:11}}}, tooltip:{callbacks:{label:c=>' '+fmt(c.raw)+' USD'}} },
          scales: {
            x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'#f1f5f9'}},
            y:{ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v)},grid:{color:'#f1f5f9'}}
          }
        }
      });
    } else {
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: meses.map(m => m.label),
          datasets: [
            { label: 'Egresos', data: meses.map(m=>m.eg), backgroundColor:'#fca5a5', borderColor:'#ef4444', borderWidth:1, borderRadius:4 },
            { label: 'Ingresos', data: meses.map(m=>m.ing), backgroundColor:'#86efac', borderColor:'#22c55e', borderWidth:1, borderRadius:4 },
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins: { legend:{labels:{color:'#64748b',font:{size:11}}}, tooltip:{callbacks:{label:c=>' '+fmt(c.raw)+' USD'}} },
          scales: {
            x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}},
            y:{ticks:{color:'#94a3b8',font:{size:10},callback:v=>fmt(v)},grid:{color:'#f1f5f9'}}
          }
        }
      });
    }
  }, 50);
}

// ── SOCIOS / DIVIDENDOS ──────────────────────────────────────────────────────
function renderSocios(area) {
  const div = data.dividendos || { pablo:0, joni:0, total:0, historial:[] };
  const pablo = parseFloat(div.pablo||0);
  const joni  = parseFloat(div.joni||0);
  const total = pablo + joni;
  const pctPablo = total > 0 ? (pablo/total*100).toFixed(1) : 50;
  const pctJoni  = total > 0 ? (joni/total*100).toFixed(1) : 50;

  // Agrupar por mes
  const porMes = div.por_mes || {};
  const mesesKeys = Object.keys(porMes).sort().slice(-12);

  area.innerHTML = `
    <div style="padding:16px;display:flex;flex-direction:column;gap:12px">

      <!-- HEADER -->
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:15px;font-weight:700;color:var(--text)">Socios — Retiro de dividendos</div>
        <button onclick="exportarDividendosCSV()" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:11px;cursor:pointer;font-weight:600;color:var(--muted)">⬇ CSV</button>
      </div>

      <!-- KPIs SOCIOS -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div class="kpi-card" style="margin:0;background:#eff6ff;border-color:#bfdbfe">
          <div class="kpi-label">Pablo Masnatta</div>
          <div class="kpi-value" style="color:#1d4ed8">${fmt(pablo)}</div>
          <div style="font-size:11px;color:#3b82f6;margin-top:4px">${pctPablo}% del total</div>
          <div style="margin-top:8px;height:4px;background:#dbeafe;border-radius:2px">
            <div style="height:4px;background:#3b82f6;border-radius:2px;width:${pctPablo}%"></div>
          </div>
        </div>
        <div class="kpi-card" style="margin:0;background:#fdf4ff;border-color:#e9d5ff">
          <div class="kpi-label">Jonatan D Astolfo</div>
          <div class="kpi-value" style="color:#7c3aed">${fmt(joni)}</div>
          <div style="font-size:11px;color:#8b5cf6;margin-top:4px">${pctJoni}% del total</div>
          <div style="margin-top:8px;height:4px;background:#ede9fe;border-radius:2px">
            <div style="height:4px;background:#8b5cf6;border-radius:2px;width:${pctJoni}%"></div>
          </div>
        </div>
        <div class="kpi-card" style="margin:0">
          <div class="kpi-label">Total distribuido</div>
          <div class="kpi-value">${fmt(total)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">${(div.historial||[]).length} retiros</div>
        </div>
      </div>

      <!-- HISTORIAL MENSUAL -->
      ${mesesKeys.length ? `
      <div class="dash-card" style="padding:16px">
        <div style="font-size:12px;font-weight:600;margin-bottom:12px">Retiros por mes</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${mesesKeys.map(mes => {
            const m = porMes[mes];
            const maxM = Math.max(...mesesKeys.map(k=>porMes[k].pablo+porMes[k].joni),1);
            const tot = m.pablo + m.joni;
            return `<div style="display:flex;align-items:center;gap:8px">
              <div style="font-size:10px;font-family:'Space Mono',monospace;color:var(--muted);width:52px">${mes}</div>
              <div style="flex:1;display:flex;flex-direction:column;gap:2px">
                ${m.pablo>0?`<div style="height:5px;background:#3b82f6;border-radius:2px;width:${(m.pablo/maxM*100).toFixed(0)}%"></div>`:''}
                ${m.joni>0?`<div style="height:5px;background:#8b5cf6;border-radius:2px;width:${(m.joni/maxM*100).toFixed(0)}%"></div>`:''}
              </div>
              <div style="font-size:11px;font-family:'Space Mono',monospace;color:var(--text);width:60px;text-align:right">${fmt(tot)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:10px">
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:5px;border-radius:2px;background:#3b82f6"></div>Pablo</div>
          <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><div style="width:10px;height:5px;border-radius:2px;background:#8b5cf6"></div>Jonatan</div>
        </div>
      </div>` : ''}

      <!-- TABLA HISTORIAL -->
      <div class="dash-card" style="padding:0;overflow:hidden">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600">Historial de retiros</div>

          <tbody>
            ${(div.historial||[]).length ? (div.historial||[]).map(d => `<tr>
              <td style="font-family:'Space Mono',monospace;color:var(--muted)">${d.fecha}</td>
              <td style="font-weight:600;color:${d.socio.toLowerCase().includes('pablo')?'#1d4ed8':'#7c3aed'}">${d.socio}</td>
              <td style="color:var(--muted);font-size:11px">${d.notas||'—'}</td>
              <td style="text-align:right;font-family:'Space Mono',monospace;font-weight:600">${fmt(d.monto)}</td>
            </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Sin retiros registrados</td></tr>'}
          </tbody>
        </table>
      </div>

    </div>`;
}

function exportarDividendosCSV() {
  const div = data.dividendos || {};
  const rows = [['Fecha','Socio','Notas','Monto USD']];
  (div.historial||[]).forEach(d => rows.push([d.fecha, d.socio, d.notas||'', parseFloat(d.monto||0).toFixed(2)]));
  if (typeof descargarCSV === 'function') descargarCSV(rows, 'dividendos.csv');
}

              onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
              📄 Subir PDF
              <input type="file" accept=".pdf" style="display:none" onchange="procesarExtracto(event)">
            </label>
          </div>
          <div id="banco-status" style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace"></div>
        </div>

        <div id="conciliacion-resultado">
          <div style="text-align:center;padding:40px;color:var(--muted);font-size:12px;font-family:'DM Mono',monospace">
            📄 Subí el extracto PDF del banco para iniciar la conciliación.<br><br>
            <span style="font-size:10px;color:var(--muted2)">El sistema va a leer los movimientos automáticamente y comparar<br>contra los registros de IMPROLUX.</span>
          </div>
        </div>
      </div>

    </div>`;
}

async function procesarExtracto(event) {
  const file = event.target.files[0];
  if (!file) return;
  const banco = document.getElementById('bancoConciliar').value;
  const status = document.getElementById('banco-status');
  const resultado = document.getElementById('conciliacion-resultado');

  status.innerHTML = '⏳ Leyendo PDF...';
  resultado.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);font-family:\'DM Mono\',monospace;font-size:12px">⏳ Claude está analizando el extracto bancario...<br><br><div style="display:flex;gap:4px;justify-content:center"><span style="animation:bounce 1.2s infinite">●</span><span style="animation:bounce 1.2s infinite 0.2s">●</span><span style="animation:bounce 1.2s infinite 0.4s">●</span></div></div>';

  try {
    // Convertir PDF a base64
    const base64 = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });

    // Enviar a Railway para procesar
    const resp = await fetch(`${RAILWAY_URL}/api/extracto`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ banco, base64, filename: file.name })
    });
    const data_resp = await resp.json();

    if (!data_resp.ok) throw new Error(data_resp.error || 'Error procesando');

    extractoProcesado = data_resp;
    status.innerHTML = `<span style="color:#5BC98A">✅ ${data_resp.extracto?.movimientos?.length || 0} movimientos leídos</span>`;
    mostrarConciliacion(data_resp);

  } catch(e) {
    status.innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`;
    resultado.innerHTML = `<div style="text-align:center;padding:30px;color:var(--danger);font-size:12px;font-family:'DM Mono',monospace">Error: ${e.message}<br><br>Verificá que el PDF sea legible (no escaneado).</div>`;
  }
}

function mostrarConciliacion(data_resp) {
  const resultado = document.getElementById('conciliacion-resultado');
  const extracto = data_resp.extracto || {};
  const conc = data_resp.conciliacion || [];

  const conciliados = conc.filter(c => c.estado === 'CONCILIADO').length;
  const pendientes = conc.filter(c => c.estado === 'PENDIENTE').length;
  const total = conc.length;

  resultado.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <div class="kpi-card" style="flex:1;margin:0">
        <div class="kpi-label">Período</div>
        <div class="kpi-value" style="font-size:13px">${extracto.fecha_desde||'—'} → ${extracto.fecha_hasta||'—'}</div>
      </div>
      <div class="kpi-card green" style="flex:1;margin:0">
        <div class="kpi-label">Conciliados</div>
        <div class="kpi-value pos">${conciliados} / ${total}</div>
      </div>
      <div class="kpi-card" style="flex:1;margin:0">
        <div class="kpi-label">Pendientes</div>
        <div class="kpi-value" style="color:var(--gold)">${pendientes}</div>
      </div>
      <div class="kpi-card" style="flex:1;margin:0">
        <div class="kpi-label">Saldo final banco</div>
        <div class="kpi-value">${fmt(extracto.saldo_final||0)}</div>
      </div>
    </div>

    <table class="data-table">
      <thead>
        <tr>
          <th>Estado</th>
          <th>Fecha banco</th>
          <th>Descripción banco</th>
          <th>Monto banco</th>
          <th>Fecha sistema</th>
          <th>Concepto sistema</th>
          <th>Monto sistema</th>
          <th>Dif.</th>
        </tr>
      </thead>
      <tbody>
        ${conc.map(c => {
          const coin = c.coincidencia;
          const montoSist = coin ? (parseFloat(coin.egreso||0) || parseFloat(coin.ingreso||0)) : 0;
          const montoBco = Math.abs(c.mov_banco?.monto || 0);
          const dif = Math.abs(montoBco - montoSist);
          const estado = c.estado;
          const colorEst = estado === 'CONCILIADO' ? '#5BC98A' : 'var(--gold)';
          const iconEst = estado === 'CONCILIADO' ? '✅' : '⚠️';
          return `<tr>
            <td><span style="color:${colorEst};font-size:14px">${iconEst}</span></td>
            <td>${c.mov_banco?.fecha || '—'}</td>
            <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.mov_banco?.descripcion || '—'}</td>
            <td class="${c.mov_banco?.tipo==='DEBITO'?'neg':'pos'}">${fmt(montoBco)}</td>
            <td>${coin?.fecha || '—'}</td>
            <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${coin?.detalle || '—'}</td>
            <td>${montoSist > 0 ? fmt(montoSist) : '—'}</td>
            <td style="color:${dif > 1 ? 'var(--gold)' : 'var(--muted)'}">${dif > 0.01 ? fmt(dif) : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button onclick="exportarConciliacion()" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace">⬇ Exportar CSV</button>
    </div>`;
}

function exportarConciliacion() {
  if (!extractoProcesado) return;
  const conc = extractoProcesado.conciliacion || [];
  const bom = '\uFEFF';
  const csv = bom + 'Estado,Fecha Banco,Descripción Banco,Monto Banco,Tipo,Fecha Sistema,Concepto Sistema,Monto Sistema,Diferencia\n' +
    conc.map(c => {
      const coin = c.coincidencia;
      const montoBco = Math.abs(c.mov_banco?.monto || 0);
      const montoSist = coin ? (parseFloat(coin.egreso||0) || parseFloat(coin.ingreso||0)) : 0;
      return `"${c.estado}","${c.mov_banco?.fecha||''}","${(c.mov_banco?.descripcion||'').replace(/"/g,'""')}",${montoBco},"${c.mov_banco?.tipo||''}","${coin?.fecha||''}","${(coin?.detalle||'').replace(/"/g,'""')}",${montoSist},${Math.abs(montoBco-montoSist).toFixed(2)}`;
    }).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `conciliacion_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
